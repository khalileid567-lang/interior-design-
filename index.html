<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>محوّل الأوتوكاد إلى 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f7;--panel:#fff;--ink:#16202b;--mut:#66727f;--line:#d9dee4;--acc:#1f5fd6}
@media(prefers-color-scheme:dark){:root{--bg:#10161d;--panel:#182029;--ink:#e8edf2;--mut:#8b98a5;--line:#2a3541;--acc:#5b93f5}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--ink)}
button,select,input{font:inherit;color:inherit}
button{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:9px 14px;cursor:pointer}
button.g{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;width:100%}
#login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
#login form,#login .box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:26px;width:100%;max-width:340px;display:grid;gap:12px}
h1{font-size:20px;margin:0}small,.mut{color:var(--mut)}
#err{color:#d33;min-height:1.4em;font-size:14px}
#app{display:none;height:100%;grid-template-columns:290px 1fr}
#side{background:var(--panel);border-inline-end:1px solid var(--line);padding:14px;overflow:auto;display:grid;gap:12px;align-content:start}
#side h2{font-size:15px;margin:8px 0 0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{font-size:13px;color:var(--mut);display:grid;gap:4px}
#stage{position:relative;min-height:0}
#plan{width:100%;height:100%;display:block;cursor:crosshair}
#hint{position:absolute;top:10px;inset-inline:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px;pointer-events:none}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:14px;z-index:9}
#modal img{max-width:100%;max-height:75vh;border-radius:6px}
#log{font-size:12px;color:var(--mut);white-space:pre-wrap}
#side{min-height:0}#app{height:100vh;height:100dvh}
#zb{position:absolute;bottom:12px;inset-inline-start:12px;display:grid;gap:8px}
#zb button{width:44px;height:44px;font-size:22px;padding:0;background:var(--panel);color:var(--ink);border:1px solid var(--line)}
#umodal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
#umodal .box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;width:100%;max-width:360px;display:grid;gap:10px}
.lnk{background:none;color:var(--acc);padding:4px;text-decoration:underline}
input,select{font-size:16px}#plan{touch-action:manipulation}
@media(max-width:760px){#app{grid-template-columns:1fr;grid-template-rows:48dvh 1fr}#stage{order:-1}#side{border-inline-end:0;border-top:1px solid var(--line);padding-bottom:40px}#hint{font-size:13px;padding:6px 10px}}
</style>
</head>
<body>

<div id="login">
  <form id="lf">
    <h1>تسجيل الدخول</h1>
    <small>الدخول للمستخدمين المضافين فقط.</small>
    <input id="em" type="email" placeholder="الإيميل" required autocomplete="username">
    <input id="pw" type="password" placeholder="الباسورد" required autocomplete="current-password">
    <div id="err"></div>
    <button type="submit">دخول</button>
    <button type="button" class="lnk" id="addu2">طلب حساب جديد</button>
  </form>
</div>

<div id="app">
  <aside id="side">
    <div class="row"><h1 style="grid-column:1/2">الغرفة 3D</h1><button class="g" id="out">خروج</button></div>

    <h2>1. الملف</h2>
    <input type="file" id="file" accept=".dxf">
    <button class="g" id="demo">تنزيل ملف DXF تجريبي</button>

    <h2>2. الستايل</h2>
    <select id="style"></select>

    <h2>3. الكاميرا</h2>
    <button id="setcam">حدد مكان الكاميرا</button>
    <div class="row">
      <label>ارتفاع العين (م)<input id="eye" type="number" value="1.5" step="0.1"></label>
      <label>الزاوية FOV<input id="fov" type="number" value="70" min="30" max="110"></label>
    </div>

    <h2>4. اللقطة</h2>
    <label>الجودة
      <select id="res"><option value="1280x720">HD</option><option value="1920x1080" selected>Full HD</option><option value="3840x2160">4K</option></select>
    </label>
    <button id="shot">خد لقطة</button>

    <h2>إعدادات الرسم</h2>
    <div class="row">
      <label>سمك الحائط (م)<input id="wt" type="number" value="0.2" step="0.05"></label>
      <label>ارتفاع السقف (م)<input id="wh" type="number" value="3" step="0.1"></label>
    </div>
    <h2>المستخدمين</h2>
    <button class="g" id="addu" style="display:none">إضافة مستخدم جديد</button>
    <div id="log"></div>
  </aside>

  <main id="stage">
    <canvas id="plan"></canvas>
    <div id="zb"><button id="zi" aria-label="تكبير">+</button><button id="zo" aria-label="تصغير">−</button></div>
    <div id="hint">ارفع ملف DXF للبدء.</div>
  </main>
</div>

<div id="umodal">
  <div class="box">
    <h1>إضافة مستخدم</h1>
    <small>اكتب البيانات وابعتها لصاحب الموقع، وهو يضيفها في Firebase.</small>
    <input id="un" placeholder="الاسم">
    <input id="ue" type="email" placeholder="الإيميل" dir="ltr">
    <input id="up" type="text" placeholder="الباسورد المقترح (6 حروف أو أكتر)" dir="ltr">
    <div id="umsg" style="font-size:14px;min-height:1.3em"></div>
    <button id="uadd">إضافة المستخدم الآن</button>
    <button id="uwa">إرسال واتساب</button>
    <button id="uem">إرسال بالإيميل</button>
    <button class="g" id="uclose">إغلاق</button>
  </div>
</div>

<div id="modal">
  <img id="shotimg" alt="اللقطة">
  <div class="row" style="width:min(360px,100%)">
    <a id="dl" download="render.png"><button style="width:100%">تنزيل الصورة</button></a>
    <button class="g" id="close" style="background:var(--panel)">إغلاق</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script>
/* ============================================================
   الخطوة 1: الصق إعدادات Firebase بتاعتك هنا (مكان القيم دي)
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyB06gcEFqvz9Btl6C3EsFlnlc_KEJPr78c",
  authDomain: "interior-design-b606f.firebaseapp.com",
  projectId: "interior-design-b606f",
  appId: "1:384338226333:web:a48c87aa19d194f4afb874"
};

/* ============================================================
   جدول أسماء الـ Layers والبلوكات (زوّد عليه أي اسم تحبه)
   ============================================================ */
const LAYERS = {
  wall:   ["حائط","حيطه","جدار","حوائط"],
  door:   ["باب","ابواب"],
  window: ["شباك","شبابيك","نافذه"],
  furn:   ["فرش","اثاث","عفش"]
};
const FURN = {           // نوع المجسم : الكلمات اللي بتدل عليه في اسم البلوك
  bed:      ["سرير","تخت","bed"],
  sofa:     ["كنب","اريك","صوفا","sofa"],
  table:    ["ترابيز","طاول","منضد","سفر","table"],
  chair:    ["كرسي","chair"],
  wardrobe: ["دولاب","خزان","ثلاج","wardrobe"],
  tv:       ["تلفزيون","شاش","tv"],
  desk:     ["مكتب","desk"]
};

/* ---------- تسجيل الدخول ---------- */
const $ = id => document.getElementById(id);
const configured = !firebaseConfig.apiKey.startsWith("PASTE");
let auth = null;
if (configured) { firebase.initializeApp(firebaseConfig); auth = firebase.auth(); }
function showApp(on){ $("login").style.display = on ? "none" : "flex"; $("app").style.display = on ? "grid" : "none"; if(on) setTimeout(resize,50); }
if (!configured) { $("err").textContent = "لسه ما حطيتش إعدادات Firebase في الكود."; }
else auth.onAuthStateChanged(u => { showApp(!!u); if($("addu")) $("addu").style.display = (u && u.email.toLowerCase()===ADMIN_EMAIL.toLowerCase()) ? "" : "none"; });
$("lf").onsubmit = async e => {
  e.preventDefault();
  if(!configured) return;
  $("err").textContent = "";
  try { await auth.signInWithEmailAndPassword($("em").value.trim(), $("pw").value); }
  catch(x){ $("err").textContent = "الإيميل أو الباسورد غلط، أو الحساب غير مضاف."; }
};
$("out").onclick = () => auth && auth.signOut();

/* ---------- قراءة DXF ---------- */
const norm = s => (s||"").toLowerCase().replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/[ًٌٍَُِّْـ]/g,"");
const has = (name, arr) => { const n = norm(name); return arr.some(k => n.includes(norm(k))); };
const uni = s => s.replace(/\\U\+([0-9A-Fa-f]{4})/g, (_,h)=>String.fromCharCode(parseInt(h,16)));

function parseDXF(text){
  const L = text.split(/\r?\n/), pairs = [];
  for (let i=0;i+1<L.length;i+=2) pairs.push([parseInt(L[i].trim(),10), L[i+1].trim()]);
  const ents = [], blocks = {};
  let section = "", cur = null, blk = null, lastPoly = null;
  const push = e => { if(!e) return; if(blk) blk.ents.push(e); else if(section==="ENTITIES") ents.push(e); };
  for (let i=0;i<pairs.length;i++){
    const [c,v] = pairs[i];
    if (c===0){
      if (cur && cur.t!=="BLOCK"){ if(cur.t==="VERTEX"){ if(lastPoly) lastPoly.pts.push(cur.pts[0]||[0,0]); } else push(cur); }
      cur = null;
      if (v==="SECTION"){ section = pairs[i+1][1]; continue; }
      if (v==="ENDSEC"){ section=""; blk=null; continue; }
      if (v==="BLOCK"){ blk = {name:"", ents:[]}; cur = {t:"BLOCK"}; continue; }
      if (v==="ENDBLK"){ if(blk) blocks[blk.name]=blk; blk=null; continue; }
      if (section==="ENTITIES" || blk){
        cur = {t:v, layer:"", pts:[], name:"", sc:[1,1], rot:0, r:0, closed:false};
        if (v==="POLYLINE") lastPoly = cur;
        if (v==="SEQEND"){ cur = null; }
      }
      continue;
    }
    if (!cur) continue;
    if (cur.t==="BLOCK"){ if(c===2) blk.name = uni(v); continue; }
    const f = parseFloat(v);
    if (c===8) cur.layer = uni(v);
    else if (c===2) cur.name = uni(v);
    else if (c===10 || c===11) cur.pts.push([f,0]);
    else if (c===20 || c===21){ if(cur.pts.length) cur.pts[cur.pts.length-1][1]=f; }
    else if (c===40) cur.r = f;
    else if (c===41) cur.sc[0] = f;
    else if (c===42) cur.sc[1] = f;
    else if (c===50) cur.rot = f*Math.PI/180;
    else if (c===70) cur.closed = (parseInt(v,10)&1)===1;
  }
  if (cur && cur.t!=="VERTEX" && cur.t!=="BLOCK") push(cur);
  return {ents, blocks};
}
function bboxOf(list){
  let a=[1e18,1e18,-1e18,-1e18];
  for (const e of list){
    for (const p of (e.pts||[])){ a[0]=Math.min(a[0],p[0]-(e.r||0)); a[1]=Math.min(a[1],p[1]-(e.r||0)); a[2]=Math.max(a[2],p[0]+(e.r||0)); a[3]=Math.max(a[3],p[1]+(e.r||0)); }
  }
  return a[0]>a[2] ? null : a;
}
function segsOf(e){
  const s=[], p=e.pts;
  if (e.t==="LINE" && p.length>=2) s.push([p[0],p[1]]);
  else if ((e.t==="LWPOLYLINE"||e.t==="POLYLINE") && p.length>1){
    for (let i=0;i<p.length-1;i++) s.push([p[i],p[i+1]]);
    if (e.closed) s.push([p[p.length-1],p[0]]);
  }
  return s;
}

/* ---------- تحويل الرسم لبيانات موديل ---------- */
function buildModel(dxf, wt){
  const walls=[], opens=[], furns=[], unknown=new Set();
  const R = (x,y,a) => [x*Math.cos(a)-y*Math.sin(a), x*Math.sin(a)+y*Math.cos(a)];
  for (const e of dxf.ents){
    const isW = has(e.layer,LAYERS.wall), isD = has(e.layer,LAYERS.door), isN = has(e.layer,LAYERS.window);
    if (isW){ for (const s of segsOf(e)) if (Math.hypot(s[1][0]-s[0][0],s[1][1]-s[0][1])>0.01) walls.push(s); continue; }
    if (isD || isN){
      let o=null;
      if (e.t==="LINE"){ const [a,b]=e.pts; o={cx:(a[0]+b[0])/2,cy:(a[1]+b[1])/2,len:Math.hypot(b[0]-a[0],b[1]-a[1])}; }
      else if (e.t==="INSERT" && dxf.blocks[e.name]){
        const bb=bboxOf(dxf.blocks[e.name].ents);
        if (bb){ const w=(bb[2]-bb[0])*Math.abs(e.sc[0]), d=(bb[3]-bb[1])*Math.abs(e.sc[1]);
          const c=R(((bb[0]+bb[2])/2)*e.sc[0],((bb[1]+bb[3])/2)*e.sc[1],e.rot);
          o={cx:e.pts[0][0]+c[0],cy:e.pts[0][1]+c[1],len:Math.max(w,d)}; }
      } else { const bb=bboxOf([e]); if(bb) o={cx:(bb[0]+bb[2])/2,cy:(bb[1]+bb[3])/2,len:Math.max(bb[2]-bb[0],bb[3]-bb[1])}; }
      if (o && o.len>0.1) { o.type = isD?"door":"window"; opens.push(o); }
      continue;
    }
    if (e.t==="INSERT" && dxf.blocks[e.name]){
      const bb=bboxOf(dxf.blocks[e.name].ents); if(!bb) continue;
      const w=(bb[2]-bb[0])*Math.abs(e.sc[0]), d=(bb[3]-bb[1])*Math.abs(e.sc[1]);
      const c=R(((bb[0]+bb[2])/2)*e.sc[0],((bb[1]+bb[3])/2)*e.sc[1],e.rot);
      let type="box";
      for (const k in FURN) if (has(e.name,FURN[k])) { type=k; break; }
      if (type==="box" && !has(e.layer,LAYERS.furn)) continue;
      if (type==="box") unknown.add(e.name);
      furns.push({type,name:e.name,x:e.pts[0][0]+c[0],y:e.pts[0][1]+c[1],w,d,rot:e.rot});
    }
  }
  // ربط الفتحات بأقرب حائط
  const wl = walls.map(s=>({a:s[0],b:s[1],len:Math.hypot(s[1][0]-s[0][0],s[1][1]-s[0][1]),ops:[]}));
  let orphan=0;
  for (const o of opens){
    let best=null,bd=1e9;
    for (const w of wl){
      const dx=(w.b[0]-w.a[0])/w.len, dy=(w.b[1]-w.a[1])/w.len;
      const t=(o.cx-w.a[0])*dx+(o.cy-w.a[1])*dy, d=Math.abs(-(o.cx-w.a[0])*dy+(o.cy-w.a[1])*dx);
      if (t>-0.1 && t<w.len+0.1 && d<bd){bd=d;best={w,t};}
    }
    if (best && bd<wt+0.4) best.w.ops.push({t0:best.t-o.len/2,t1:best.t+o.len/2,type:o.type}); else orphan++;
  }
  return {wl,furns,unknown:[...unknown],orphan,nOpen:opens.length};
}

/* ---------- الستايلات ---------- */
const STYLES = {
  modern:   {n:"مودرن",wall:0xf1f1ee,floor:0x8e9297,fur:0x3b3f45,acc:0x1e2226,sky:0xdfe6ec,sun:0xffffff,si:0.9},
  classic:  {n:"كلاسيك",wall:0xe9dcc0,floor:0x7a4f2c,fur:0x6a3d25,acc:0xb08d3c,sky:0xf0e4cc,sun:0xffe2b0,si:0.85},
  neoclassic:{n:"نيو كلاسيك",wall:0xf3efe6,floor:0xcfc7b8,fur:0xe6dcc6,acc:0xc9a961,sky:0xf7f3ea,sun:0xfff0d0,si:0.9},
  scandi:   {n:"سكاندنافي",wall:0xfafaf8,floor:0xd8b98a,fur:0x9db3bf,acc:0xe5e1d6,sky:0xf3f6f8,sun:0xfff6e5,si:1.0},
  japandi:  {n:"جابندي",wall:0xeee7dc,floor:0xc9a77c,fur:0x8a7355,acc:0x2b2b2b,sky:0xf1ede6,sun:0xfff1d6,si:0.9},
  minimal:  {n:"مينيمال أبيض",wall:0xffffff,floor:0xe4e4e4,fur:0xf2f2f2,acc:0x9a9a9a,sky:0xf4f4f4,sun:0xffffff,si:1.0},
  industrial:{n:"إندستريال",wall:0xb9b6b0,floor:0x5b5b5b,fur:0x3a2f28,acc:0x1f1f1f,sky:0xc9ced3,sun:0xffffff,si:0.9},
  rustic:   {n:"ريفي",wall:0xd8c3a5,floor:0x6b4a2f,fur:0x7c5a3a,acc:0x3e2c1c,sky:0xeadcc3,sun:0xffe0b0,si:0.85},
  boho:     {n:"بوهيمي",wall:0xf0e0cc,floor:0xb98a5e,fur:0xc0623a,acc:0x2f6b62,sky:0xf6e9d6,sun:0xffe0b0,si:0.9},
  mediterranean:{n:"متوسطي",wall:0xfbfbf7,floor:0xd9c9ae,fur:0x2a5ea8,acc:0xe8e2d0,sky:0xdcecf7,sun:0xffffff,si:1.0},
  artdeco:  {n:"آرت ديكو",wall:0x1f3a3a,floor:0x141414,fur:0x0f5c5c,acc:0xd4af37,sky:0x1a2a2a,sun:0xffe9b0,si:0.7},
  midnight: {n:"ليلي أزرق",wall:0x22303c,floor:0x3b3b3b,fur:0xd9d0c1,acc:0x7fa3b8,sky:0x18222b,sun:0xc8d8ff,si:0.6},
  luxury:   {n:"لوكس داكن",wall:0x2c2c33,floor:0x1b1b1e,fur:0x8b6d3a,acc:0xd4b46a,sky:0x16161a,sun:0xffd9a0,si:0.7}
};
for (const k in STYLES) $("style").add(new Option(STYLES[k].n,k));

/* ---------- المشهد ---------- */
const scene = new THREE.Scene();
const planCam = new THREE.OrthographicCamera(-10,10,10,-10,0.1,200);
planCam.position.set(0,60,0); planCam.up.set(0,0,-1); planCam.lookAt(0,0,0);
const renderer = new THREE.WebGLRenderer({canvas:$("plan"),antialias:true});
let model=null, group=null, bounds=null, camPos=null, camTgt=null, mode="", marker=new THREE.Group();
let zoom=1;

function mat(c,r=0.8,m=0){ return new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m}); }
function box(w,h,d,m){ const x=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m); x.castShadow=x.receiveShadow=true; return x; }

function furnMesh(f,S){
  const g=new THREE.Group(), M=mat(S.fur,0.7), A=mat(S.acc,0.5,0.1);
  const put=(m,x,y,z)=>{m.position.set(x,y,z);g.add(m);return m;};
  const {w,d}=f;
  switch(f.type){
    case "bed": put(box(w,0.35,d,A),0,0.175,0); put(box(w*0.96,0.2,d*0.9,M),0,0.45,d*0.03); put(box(w,0.9,0.08,A),0,0.45,-d/2+0.04); break;
    case "sofa": put(box(w,0.4,d,M),0,0.2,0); put(box(w,0.4,d*0.25,M),0,0.6,-d*0.375); put(box(w*0.08,0.25,d*0.75,A),-w*0.46,0.52,d*0.12); put(box(w*0.08,0.25,d*0.75,A),w*0.46,0.52,d*0.12); break;
    case "table": put(box(w,0.05,d,A),0,0.75,0); [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([a,b])=>put(box(0.06,0.73,0.06,M),a*(w/2-0.06),0.365,b*(d/2-0.06))); break;
    case "desk": put(box(w,0.05,d,A),0,0.75,0); put(box(w*0.25,0.7,d*0.9,M),w*0.35,0.35,0); put(box(w*0.05,0.7,d*0.9,M),-w*0.45,0.35,0); break;
    case "chair": put(box(w,0.05,d,M),0,0.45,0); put(box(w,0.45,0.05,M),0,0.7,-d/2+0.03); [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([a,b])=>put(box(0.04,0.43,0.04,A),a*(w/2-0.04),0.215,b*(d/2-0.04))); break;
    case "wardrobe": put(box(w,2.2,d,M),0,1.1,0); put(box(0.02,1.6,0.02,A),0,1.1,d/2+0.01); break;
    case "tv": put(box(w,0.5,d,M),0,0.25,0); put(box(w*0.9,0.55,0.05,mat(0x0a0a0a,0.2)),0,0.85,0); break;
    default: put(box(w,0.5,d,M),0,0.25,0);
  }
  g.position.set(f.x,0,-f.y); g.rotation.y=f.rot;
  return g;
}

function buildScene(){
  if (group) scene.remove(group);
  scene.children.filter(o=>o.isLight).forEach(o=>scene.remove(o));
  if (!model) return;
  const S=STYLES[$("style").value], th=+$("wt").value||0.2, H=+$("wh").value||3;
  scene.background=new THREE.Color(S.sky);
  group=new THREE.Group();
  const wm=mat(S.wall,0.9), gm=new THREE.MeshStandardMaterial({color:0x9fc4dd,transparent:true,opacity:0.35,roughness:0.1});
  let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  for (const w of model.wl){
    for (const p of [w.a,w.b]){minx=Math.min(minx,p[0]);maxx=Math.max(maxx,p[0]);miny=Math.min(miny,p[1]);maxy=Math.max(maxy,p[1]);}
    const dx=(w.b[0]-w.a[0])/w.len, dy=(w.b[1]-w.a[1])/w.len, ang=Math.atan2(dy,dx);
    const piece=(t0,t1,z0,z1,m)=>{
      if (t1-t0<0.005||z1-z0<0.005) return;
      const mesh=box(t1-t0,z1-z0,m===gm?0.03:th,m), tm=(t0+t1)/2;
      mesh.position.set(w.a[0]+dx*tm,(z0+z1)/2,-(w.a[1]+dy*tm)); mesh.rotation.y=ang; group.add(mesh);
    };
    const ops=w.ops.map(o=>({...o,t0:Math.max(o.t0,0),t1:Math.min(o.t1,w.len),z0:o.type==="door"?0:0.9,z1:2.1})).sort((a,b)=>a.t0-b.t0);
    let t=-th/2;
    for (const o of ops){
      piece(t,o.t0,0,H,wm);
      if (o.z0>0) piece(o.t0,o.t1,0,o.z0,wm);
      piece(o.t0,o.t1,o.z1,H,wm);
      if (o.type==="window") piece(o.t0,o.t1,o.z0,o.z1,gm);
      t=Math.max(t,o.t1);
    }
    piece(t,w.len+th/2,0,H,wm);
  }
  if (minx>maxx){ minx=miny=0; maxx=maxy=5; }
  for (const f of model.furns){ minx=Math.min(minx,f.x-f.w);maxx=Math.max(maxx,f.x+f.w);miny=Math.min(miny,f.y-f.d);maxy=Math.max(maxy,f.y+f.d); group.add(furnMesh(f,S)); }
  const fw=maxx-minx+2, fd=maxy-miny+2, cx=(minx+maxx)/2, cz=-(miny+maxy)/2;
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(fw,fd),mat(S.floor,0.6)); floor.rotation.x=-Math.PI/2; floor.position.set(cx,0,cz); floor.receiveShadow=true; group.add(floor);
  bounds={cx,cz,w:fw,d:fd};
  scene.add(group);
  scene.add(new THREE.HemisphereLight(0xffffff,0x555555,0.75));
  const sun=new THREE.DirectionalLight(S.sun,S.si); sun.position.set(cx+fw*0.4,H*3,cz+fd*0.3); sun.target.position.set(cx,0,cz);
  sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
  const sc=sun.shadow.camera, ex=Math.max(fw,fd); sc.left=-ex;sc.right=ex;sc.top=ex;sc.bottom=-ex;sc.far=ex*6;
  scene.add(sun,sun.target);
  const pl=new THREE.PointLight(0xfff0dd,0.6,fw*3); pl.position.set(cx,H-0.3,cz); scene.add(pl);
  fitPlan(); drawMarker();
}

/* ---------- عرض المسقط ---------- */
function resize(){
  const c=$("stage"); renderer.setSize(c.clientWidth,c.clientHeight,false); fitPlan();
}
function fitPlan(){
  const c=$("stage"), asp=c.clientWidth/Math.max(c.clientHeight,1);
  const b=bounds||{cx:0,cz:0,w:10,d:10};
  let h=Math.max(b.d, b.w/asp)*0.6/zoom, w=h*asp;
  planCam.left=-w; planCam.right=w; planCam.top=h; planCam.bottom=-h; planCam.updateProjectionMatrix();
  planCam.position.set(b.cx,60,b.cz); planCam.lookAt(b.cx,0,b.cz);
}
function drawMarker(){
  scene.remove(marker); marker=new THREE.Group();
  if (camPos){
    const m=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.15,0.05,20),new THREE.MeshBasicMaterial({color:0xe23b3b})); m.position.set(camPos.x,3.5,camPos.z); marker.add(m);
    if (camTgt){
      const pts=[new THREE.Vector3(camPos.x,3.5,camPos.z),new THREE.Vector3(camTgt.x,3.5,camTgt.z)];
      marker.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0xe23b3b})));
      const ang=Math.atan2(camTgt.x-camPos.x,camTgt.z-camPos.z), half=(+$("fov").value||70)*Math.PI/360, L=Math.hypot(camTgt.x-camPos.x,camTgt.z-camPos.z);
      const q=[camPos.x,camPos.z].map(Number), mk=a=>new THREE.Vector3(camPos.x+Math.sin(ang+a)*L,3.5,camPos.z+Math.cos(ang+a)*L);
      marker.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([mk(-half),new THREE.Vector3(camPos.x,3.5,camPos.z),mk(half)]),new THREE.LineBasicMaterial({color:0xe2a33b})));
    }
  }
  scene.add(marker);
}
function loop(){ requestAnimationFrame(loop); if($("app").style.display!=="none") renderer.render(scene,planCam); }
renderer.setClearColor(0xdfe6ec); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;

$("plan").addEventListener("wheel",e=>{ e.preventDefault(); zoom=Math.min(6,Math.max(0.4,zoom*(e.deltaY<0?1.1:0.9))); fitPlan(); },{passive:false});
$("plan").addEventListener("click",e=>{
  if(!mode) return;
  const r=$("plan").getBoundingClientRect();
  const v=new THREE.Vector3(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1,0).unproject(planCam);
  if(mode==="pos"){ camPos={x:v.x,z:v.z}; camTgt=null; mode="tgt"; $("hint").textContent="دوس على المكان اللي الكاميرا هتبص ناحيته."; }
  else { camTgt={x:v.x,z:v.z}; mode=""; $("hint").textContent="تمام. غيّر الزاوية لو عايز، وبعدين اضغط «خد لقطة»."; }
  drawMarker();
});
$("setcam").onclick=()=>{ if(!model){ $("hint").textContent="ارفع ملف DXF الأول."; return; } mode="pos"; $("hint").textContent="دوس على مكان الكاميرا في المسقط."; };
$("fov").oninput=drawMarker;
$("zi").onclick=()=>{zoom=Math.min(6,zoom*1.25);fitPlan();};
$("zo").onclick=()=>{zoom=Math.max(0.4,zoom/1.25);fitPlan();};
const ADMIN_EMAIL="khalileid567@gmail.com";   // غيّره لإيميلك لو مختلف

const openU=()=>{ const a=isAdmin(); $("uadd").style.display=a?"":"none"; $("uwa").style.display=$("uem").style.display=a?"none":""; $("umsg").textContent=""; $("umodal").style.display="flex"; };

};
$("addu").onclick=openU; $("addu2").onclick=openU; $("uclose").onclick=()=>$("umodal").style.display="none";
function umsg(){

  return "طلب إضافة مستخدم\nالاسم: "+$("un").value.trim()+"\nالإيميل: "+e+"\nالباسورد: "+p;
}
$("uwa").onclick=()=>{ const m=umsg(); if(m) window.open("https://wa.me/?text="+encodeURIComponent(m),"_blank"); };
$("uem").onclick=()=>{ const m=umsg(); if(m) location.href="mailto:"+ADMIN_EMAIL+"?subject="+encodeURIComponent("طلب إضافة مستخدم")+"&body="+encodeURIComponent(m); };
["style","wt","wh"].forEach(id=>$(id).onchange=buildScene);

/* ---------- اللقطة ---------- */
$("shot").onclick=()=>{
  if(!model||!camPos||!camTgt){ $("hint").textContent="حدد مكان الكاميرا واتجاهها الأول."; return; }
  const [W,Hh]=$("res").value.split("x").map(Number), eye=+$("eye").value||1.5;
  const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
  r.setSize(W,Hh); r.setPixelRatio(1); r.shadowMap.enabled=true; r.shadowMap.type=THREE.PCFSoftShadowMap;
  r.toneMapping=THREE.ACESFilmicToneMapping; r.outputEncoding=THREE.sRGBEncoding;
  const cam=new THREE.PerspectiveCamera(+$("fov").value||70,W/Hh,0.05,200);
  cam.position.set(camPos.x,eye,camPos.z); cam.lookAt(camTgt.x,eye,camTgt.z);
  scene.remove(marker); r.render(scene,cam); scene.add(marker);
  const url=r.domElement.toDataURL("image/png");
  r.dispose(); r.forceContextLoss();
  $("shotimg").src=url; $("dl").href=url; $("modal").style.display="flex";
};
$("close").onclick=()=>$("modal").style.display="none";

/* ---------- رفع الملف ---------- */
$("file").onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  try {
  const buf=await f.arrayBuffer();
  let txt=new TextDecoder("utf-8").decode(buf);
  const dxf=parseDXF(txt);
  model=buildModel(dxf,+$("wt").value||0.2);
  camPos=camTgt=null; zoom=1; mode="";
  buildScene();
  } catch(err){ $("log").textContent="خطأ: "+err.message; $("hint").textContent="حصل خطأ: "+err.message; return; }
  $("log").textContent=`حوائط: ${model.wl.length}\nأبواب وشبابيك: ${model.nOpen}${model.orphan?` (${model.orphan} مش على حائط)`:""}\nقطع فرش: ${model.furns.length}`+(model.unknown.length?`\nبلوكات غير معروفة (طلعت بوكس): ${model.unknown.join("، ")}`:"");
  $("hint").textContent=model.wl.length?"اضغط «حدد مكان الكاميرا».":"مالقيتش حوائط. تأكد إن اسم الـ Layer «حائط».";
};

/* ---------- ملف تجريبي ---------- */
$("demo").onclick=()=>{
  const P=[];const add=(c,v)=>P.push(c,v);
  const line=(l,a,b,c,d)=>{add(0,"LINE");add(8,l);add(10,a);add(20,b);add(11,c);add(21,d);};
  add(0,"SECTION");add(2,"BLOCKS");
  const blk=(n,w,d)=>{add(0,"BLOCK");add(2,n);add(8,"0");add(10,0);add(20,0);
    [[0,0,w,0],[w,0,w,d],[w,d,0,d],[0,d,0,0]].forEach(s=>line("0",...s));add(0,"ENDBLK");};
  blk("سرير",1.6,2);blk("كنبه",2.2,0.9);blk("ترابيزه",1.0,0.6);
  add(0,"ENDSEC");add(0,"SECTION");add(2,"ENTITIES");
  [[0,0,5,0],[5,0,5,4],[5,4,0,4],[0,4,0,0]].forEach(s=>line("حائط",...s));
  line("باب",1.2,0,2.1,0); line("شباك",3,4,4.2,4);
  const ins=(n,x,y,r)=>{add(0,"INSERT");add(8,"فرش");add(2,n);add(10,x);add(20,y);add(50,r);};
  ins("سرير",3.3,0.2,0); ins("كنبه",0.3,3.6,0); ins("ترابيزه",1.5,2.5,0);
  add(0,"ENDSEC");add(0,"EOF");
  let s="";for(let i=0;i<P.length;i+=2)s+=P[i]+"\n"+P[i+1]+"\n";
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([s],{type:"text/plain"}));a.download="demo-room.dxf";a.click();
};

resize(); loop();
